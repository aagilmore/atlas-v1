name: ATLAS V1.3 regression
on:
  push:
    branches:
      - feature/atlas-v1.3-weekly-history
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask
      - run: python -m py_compile web_app_v10.py atlas_weekly_archive_v1_3.py test_atlas_v1_3.py
      - run: python -m unittest -v test_atlas_v1_3.py
